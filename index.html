  .upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: var(--accent-dim); }

  .thumb-wrap { position: relative; display: inline-block; }
  .thumb-remove { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; font-size: 10px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .send-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }

</style>

<body>
<div id="root"></div>
<script type="text/babel">
// ═══════════════════════════════════════════════════════════
// CONFIG  — no API key here anymore, it lives inside the Apps Script proxy
// ═══════════════════════════════════════════════════════════
// Paste your Apps Script Web App /exec URL here (proxies the AI, logs submissions,
// AND serves the private player roster so the players Sheet never needs to be public):
const PROXY_URL = 'https://script.google.com/macros/s/AKfycbyyBC0b90LjFCHRbmq_DqXZwj3fBkb-hZUKb5UBLBa_6O--0sPuCwftELtDpH7fbBUr/exec';
// The player roster is read by the Apps Script from PLAYERS_SHEET_ID (Script Property),
// so no Sheet URL is needed here and the kids' data stays private.
// ═══════════════════════════════════════════════════════════

const CREST_URL = 'https://www.magyarfutball.hu/data/logos/0/0036/logo_0036_02.png';

// Fallback roster used only if the roster can't be loaded (proxy not set up yet).
const FALLBACK_PLAYERS = [
  { name: 'teszt', pos: '#6' },
];

const MATCHES = [
  { date: '2026-08-01', label: '2026.08.01. 10:00 – REAC vs BSC' },
  { date: '2026-08-05', label: '2026.08.05. – Edzőtábor (részlet később)' },
  { date: '2026-08-15', label: '2026.08.15. 09:00 – Soroksár vs BSC' },
  { date: '2026-08-19', label: '2026.08.19. 17:00 – Gloriett vs BSC' },
  { date: '2026-08-22', label: '2026.08.22. 09:00 – BSC vs Budai' },
];

const DAYS      = ['H','K','Sz','Cs','P','Szo','V'];
const DAY_NAMES = ['Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat','Vasárnap'];

const TOOLS = [
  { id: 'palya',   icon: '⚽', label: 'Futballpálya' },
  { id: 'futpark', icon: '🏃', label: 'Futópálya / Park' },
  { id: 'otthon',  icon: '🏠', label: 'Otthon (terem/kert)' },
  { id: 'kondo',   icon: '🏋️', label: 'Konditerem' },
  { id: 'labda',   icon: '🎯', label: 'Labda elérhető' },
  { id: 'kapu',    icon: '🥅', label: 'Kapu elérhető' },
];

// ── Player roster (read via the Apps Script proxy from the private Sheet) ───
// Expected columns (header row, any order, case-insensitive):
//   name, position, birthdate, sitting_height, standing_height, weight, measured_at
function normKey(k) { return String(k || '').trim().toLowerCase().replace(/\s+/g, '_'); }

// Turn raw row objects (from the proxy) into the player shape the app uses.
// The roster Sheet is historical (one row per measurement), so we keep only the
// most recent measurement per player — same idea as ROW_NUMBER() dedup by date.
function mapPlayers(rows) {
  const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
  const str = v => (v == null ? '' : String(v)).trim();
  const mapped = rows.map(row => {
    const r = {};
    Object.keys(row).forEach(k => { r[normKey(k)] = row[k]; });
    return {
      name:      str(r.name || r.nev || r.jatekos),
      pos:       str(r.position || r.poszt || r.pos),
      birthdate: str(r.birthdate || r.szuletes || r.dob),
      sitting:   num(r.sitting_height || r.ulomagassag || r.ulo),
      standing:  num(r.standing_height || r.allomagassag || r.allo || r.magassag),
      weight:    num(r.weight || r.testsuly || r.suly),
      measured:  str(r.measured_at || r.meres_datuma || r.datum),
    };
  }).filter(p => p.name);

  // Keep the latest row per player (by measured date; ties/undated -> last row wins).
  const latest = new Map();
  for (const p of mapped) {
    const prev = latest.get(p.name);
    if (!prev) { latest.set(p.name, p); continue; }
    const t = Date.parse(p.measured) || 0;
    const tPrev = Date.parse(prev.measured) || 0;
    if (t >= tPrev) latest.set(p.name, p);
  }
  return Array.from(latest.values()).sort((a, b) => a.name.localeCompare(b.name, 'hu'));
}

// ── Biological maturity estimate (Mirwald 2002, boys) ──────────────────────
// Uses sitting/standing height + weight + age to estimate "years from PHV".
function decimalAge(birthdate, refDate) {
  if (!birthdate) return null;
  const b = new Date(birthdate);
  const ref = refDate ? new Date(refDate) : new Date();
  if (isNaN(b) || isNaN(ref)) return null;
  return (ref - b) / (365.25 * 86400000);
}

function maturity(p) {
  const age = decimalAge(p.birthdate, p.measured);
  if (!age || !p.standing || !p.sitting || !p.weight) return null;
  const leg = p.standing - p.sitting;

  // Data sanity: the Mirwald estimate is very sensitive to age and leg length,
  // so flag the common data-entry bugs instead of trusting a wild number.
  const issues = [];
  if (leg <= 0)                        issues.push('ülő ≥ álló magasság (fel vannak cserélve?)');
  if (age < 10 || age > 18)            issues.push(`életkor gyanús (${age.toFixed(1)} év – szül. vagy mérés dátuma?)`);
  if (p.standing < 120 || p.standing > 200) issues.push(`álló magasság gyanús (${p.standing} – cm?)`);
  if (p.sitting  < 55  || p.sitting  > 110) issues.push(`ülő magasság gyanús (${p.sitting} – cm?)`);
  if (p.weight   < 25  || p.weight   > 100) issues.push(`testsúly gyanús (${p.weight} – kg?)`);

  const offset = -9.236
    + 0.0002708 * (leg * p.sitting)
    - 0.001663  * (age * leg)
    + 0.007216  * (age * p.sitting)
    + 0.02292   * (p.weight / p.standing * 100);
  const phvAge = age - offset; // estimated age at peak height velocity
  let label, color, note;
  if (offset < -1)      { label = 'PHV előtt';         color = '#4488ff'; note = 'Növekedési lökés előtt.'; }
  else if (offset <= 1) { label = 'PHV körül (kritikus)'; color = '#ffc107'; note = 'Aktív növekedési lökés – emelt sérülés- és Osgood-Schlatter-kockázat, óvatos plyometria.'; }
  else                  { label = 'PHV után';          color = '#c8f135'; note = 'A növekedési lökés csúcsán túl.'; }
  return { age: age.toFixed(1), leg: Math.round(leg), offset: offset.toFixed(1), phvAge: phvAge.toFixed(1), label, color, note, issues };
}

// ── Matchday-minus load logic ──────────────────────────────────────────────
// Maps a training day to an intensity target based on days-to-next-match.
function dowIndex(jsDay) { return (jsDay + 6) % 7; } // Mon=0 ... Sun=6

function nextDateForDay(dayLetter) {
  const target = DAYS.indexOf(dayLetter);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const delta = (target - dowIndex(today.getDay()) + 7) % 7;
  const d = new Date(today); d.setDate(today.getDate() + delta);
  return d;
}

function loadForDay(dayLetter, matchDateStr) {
  const dayDate = nextDateForDay(dayLetter);
  const match = new Date(matchDateStr); match.setHours(0, 0, 0, 0);
  const md = Math.round((match - dayDate) / 86400000); // days until match
  if (md < 0)   return { md, tag: 'MD+',  label: 'Regeneráció',      short: 'REGEN',  color: '#4488ff' };
  if (md === 0) return { md, tag: 'MD',   label: 'Meccsnap',         short: 'MECCS',  color: '#666'    };
  if (md === 1) return { md, tag: 'MD-1', label: 'Aktiváló / könnyű', short: 'KÖNNYŰ', color: '#8bc34a' };
  if (md === 2) return { md, tag: 'MD-2', label: 'Gyorsaság / közepes', short: 'KÖZEP', color: '#ffc107' };
  if (md === 3) return { md, tag: 'MD-3', label: 'Erő / intenzitás csúcs', short: 'CSÚCS', color: '#ff7043' };
  return          { md, tag: 'MD-' + md, label: 'Fejlesztő / magasabb terhelés', short: 'FEJL', color: '#c8f135' };
}

function getNextMatch() {
  const today = new Date().toISOString().slice(0, 10);
  return MATCHES.find(m => m.date >= today) || MATCHES[MATCHES.length - 1];
}
function matchDateFromLabel(label) {
  const m = MATCHES.find(x => x.label === label);
  return m ? m.date : getNextMatch().date;
}

function calcFitness(d) {
  if (!d) return null;
  const days = Math.floor((new Date() - new Date(d)) / 86400000);
  if (days <= 3)  return { label: 'Kiváló',       color: '#c8f135', segs: 5 };
  if (days <= 7)  return { label: 'Jó',            color: '#8bc34a', segs: 4 };
  if (days <= 14) return { label: 'Közepes',       color: '#ffc107', segs: 3 };
  if (days <= 21) return { label: 'Gyenge',        color: '#ff7043', segs: 2 };
  return             { label: 'Nagyon gyenge', color: '#f44336', segs: 1 };
}

// Compress an image with canvas — max 500px, jpg 0.55 (~40-70KB).
function compressImage(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 500;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.55));
    };
    img.onerror = () => resolve('');
    img.src = dataUrl;
  });
}

// POST helper to the Apps Script proxy. Uses text/plain body -> no CORS preflight.
async function callProxy(payload) {
  const res = await fetch(PROXY_URL, { method: 'POST', body: JSON.stringify(payload) });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); }
  catch {
    // Not JSON -> almost always the Google login/HTML page, which means the Web App
    // deployment access isn't "Anyone", or the /exec URL is wrong/old.
    throw new Error('A proxy nem JSON-t adott vissza (HTTP ' + res.status + ') – valószínűleg bejelentkezési oldal.');
  }
  if (!data.ok) throw new Error(data.error || 'Ismeretlen backend hiba.');
  return data;
}

// Turn a raw proxy error into a plain-Hungarian, actionable hint for the UI.
function proxyHint(msg) {
  if (/Failed to fetch|NetworkError|CORS/i.test(msg))
    return 'Nem érhető el a proxy (CORS/hozzáférés). Ellenőrizd: a Telepítés hozzáférése „Bárki", és a PROXY_URL a /exec végű Web App URL.';
  if (/Ismeretlen művelet/i.test(msg))
    return 'A proxy fut, de a RÉGI kódot szolgálja ki (nem ismeri a „players" műveletet). Telepíts ÚJ VERZIÓT: Telepítés → Telepítések kezelése → ceruza → Verzió: Új verzió.';
  if (/PLAYERS_SHEET_ID/i.test(msg))
    return 'Hiányzik a PLAYERS_SHEET_ID a Script Properties-ben (a névsor-Sheet ID-ja).';
  if (/nem JSON/i.test(msg))
    return msg + ' Ellenőrizd, hogy a Telepítés hozzáférése „Bárki".';
  return msg;
}

function renderMarkdown(text) {
  let h = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^## (.+)/gm,'<h2>$1</h2>')
    .replace(/^### (.+)/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^- (.+)/gm,'<li>$1</li>')
    .replace(/^---$/gm,'<hr/>')
    .replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br/>');
  return `<p>${h}</p>`;
}

function App() {
  const [view, setView]       = React.useState('form');
  const [result, setResult]   = React.useState(null);
  const [fd, setFd]           = React.useState(null);
  const [players, setPlayers] = React.useState(null);

  React.useEffect(() => {
    const configured = PROXY_URL && !PROXY_URL.includes('PASTE');
    if (!configured) { setPlayers(FALLBACK_PLAYERS); return; }
    callProxy({ action: 'players' })
      .then(data => {
        const list = mapPlayers(data.players || []);
        if (!list.length) throw new Error('A Sheet elérhető, de egy játékost sem találtam – ellenőrizd a fejléc-neveket (name, position, birthdate…) és hogy van adatsor.');
        setPlayers(list); setRosterError(null);
      })
      .catch(err => { console.warn('Játékos-lista betöltés sikertelen:', err.message); setRosterError(proxyHint(err.message)); setPlayers(FALLBACK_PLAYERS); });
  }, []);

  if (players === null) {
    return <div className="center-load"><div className="spinner-w" style={{ margin: '0 auto 14px' }}/>Játékoslista betöltése…</div>;
  }
  if (view === 'result') return <ResultPage data={result} form={fd} onBack={() => setView('form')} />;

    { label: form.pl?.pos,        cls: 'accent' },
    { label: form.fitness?.label, cls: 'accent' },
    form.mat && { label: `PHV: ${form.mat.label}`, cls: form.mat.offset > -1 && form.mat.offset < 1 ? 'amber' : 'blue' },
    { label: form.daysText,       cls: '' },
    form.schlatter && { label: '⚠ Schlatter', cls: 'red' },
    form.physio === 'igen' && { label: '🏥 Fizio', cls: 'blue' },
  ].filter(Boolean);

  const rpeHints = { 1:'könnyű', 2:'közepes', 3:'nehéz', 4:'nagyon nehéz' };

  return (
    <div className="result-page">
      <div className="result-topbar">
        {crestErr ? <div className="topbar-crest-fallback">⚽</div>
          : <img className="topbar-crest" src={CREST_URL} alt="Budaörs" onError={() => setCrestErr(true)} />}
        <div className="topbar-player">
          <strong>{form.player}</strong>
          <span>{form.pl?.pos || '–'} · {form.fitness?.label || '–'}</span>
        </div>
        <div className="topbar-actions">
          <button className="topbar-btn" onClick={() => window.print()}>🖨 Nyomtatás</button>
          <button className="topbar-btn" onClick={onBack}>← Vissza</button>
        </div>
      </div>

      <div className="result-content">
        {data.isDemo && <div className="demo-banner" style={{ marginBottom: 16 }}>⚠️ Demo mód – minta edzésterv. PROXY_URL szükséges a valódihoz.</div>}

        <div className="meta-chips">
          {chips.map((c,i) => c.label && <span key={i} className={`chip ${c.cls}`}>{c.label}</span>)}
        </div>

        <div className="plan-box">
          {planText
            ? <div dangerouslySetInnerHTML={{ __html: renderMarkdown(planText) }} />
            : <div className="plan-loading"><div className="spinner-w"/>Edzésterv készül…</div>}
        </div>

        <div className="submit-section">
          <h3>✅ Edzés teljesítve – beküldés az edzőnek</h3>
          <p className="submit-sub">Ha megcsináltad az edzést, töltsd ki és küldd be. Egyenesen az edző naplójába kerül.</p>

          <div className="field">
            <label>Időtartam (perc)</label>
            <input type="number" min="0" placeholder="pl. 60" value={duration} onChange={e => setDuration(e.target.value)} />
          </div>

          <div className="field">
            <label>Mennyire volt megterhelő?</label>
            <div className="rpe-track">
              {[1,2,3,4].map(n =>
                <div key={n} className={`rpe-cell ${rpe===n?'active':''}`} onClick={() => setRpe(n)}>{n}</div>
              )}
            </div>
            {rpe && <p className="rpe-hint">{rpe} – {rpeHints[rpe]}</p>}
          </div>

          <div className="field">
            <div className="card">
              <div className="toggle-row">
                <div className="toggle-info">
                  <strong>Volt fájdalom vagy panasz?</strong>
                  <p>Pl. térd, boka, izom – fontos a terhelés követéséhez</p>
                </div>
                <div className={`toggle-switch ${pain?'on':''}`} onClick={() => setPain(!pain)} />
              </div>
            </div>
            {pain && (
              <input type="text" style={{ marginTop: 10 }} placeholder="Hol és milyen? (pl. jobb térd, edzés közben)" value={painArea} onChange={e => setPainArea(e.target.value)} />
            )}
          </div>

          <div className="field">
            <label>Megjegyzés (opcionális)</label>
            <textarea placeholder="Hogyan ment? Mit hagytál ki, ha valamit?" value={notes} onChange={e => setNotes(e.target.value)} />
          </div>

          <div className="field">
            <label>Fotó / képernyőkép (opcionális, max 3)</label>
            <div className={`upload-area ${dragover?'dragover':''}`}
              onClick={() => fileRef.current.click()}
              onDragOver={e => { e.preventDefault(); setDragover(true); }}
              onDragLeave={() => setDragover(false)}
              onDrop={e => { e.preventDefault(); setDragover(false); handleFiles(e.dataTransfer.files); }}>
              <div className="upload-icon">📸</div>
              <p>Húzd ide a képet, vagy kattints a feltöltéshez</p>
              <p style={{ fontSize: 11, marginTop: 4 }}>Automatikusan tömörítve, a Drive-mappádba mentve</p>
            </div>
            <input ref={fileRef} type="file" accept="image/*" multiple style={{ display:'none' }} onChange={e => handleFiles(e.target.files)} />
            {images.length > 0 && (
              <div className="upload-previews">
                {images.slice(0,3).map((img,i) => (
                  <div key={i} className="thumb-wrap">
                    <img className="upload-thumb" src={img.url} alt="" />
                    <button className="thumb-remove" onClick={() => removeImage(i)}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <button className="send-btn" onClick={handleSubmit} disabled={sending || sendStatus === 'ok'}>
            {sending
              ? <><div className="spinner-w"/><span>Küldés...</span></>
              : sendStatus === 'ok' ? '✅ BEKÜLDVE' : `📧 BEKÜLDÉS${images.length > 0 ? ` (${images.length} kép)` : ''}`}
          </button>

          {sendStatus === 'ok' && (
            <p className="success-msg">✅ Beküldve! Az edző naplójába bekerült{images.length > 0 ? ' a fotókkal együtt' : ''}.</p>
          )}
          {sendStatus?.startsWith('err') && (
            <p className="error-msg">❌ {sendStatus.replace('err:','')}</p>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
